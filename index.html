<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111a2b"><title>畢業倒數100天｜生涯 RPG</title><style>
:root{color-scheme:dark;--bg:#101827;--panel:#1c293c;--line:#34445d;--ink:#f5f0e5;--muted:#acbbcc;--gold:#efc581;--green:#88d2ad;--blue:#82bdeb;--pink:#f2a2a3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% 0,#263852 0,transparent 50%),var(--bg);color:var(--ink);font-family:system-ui,"Microsoft JhengHei",sans-serif;line-height:1.6}button,a{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:4px}button:disabled{opacity:.5;cursor:default}main{width:min(100% - 28px,940px);margin:0 auto;padding:22px 0 36px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{color:var(--gold);font-size:12px;letter-spacing:.19em;font-weight:900}.tag{font-size:12px;color:var(--muted)}.mini{background:transparent;border:1px solid var(--line);padding:8px 13px;border-radius:9px;font-size:13px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 14px 48px #0004}.pad{padding:clamp(18px,4vw,36px)}h1,h2,h3,p{margin:0 0 12px}h1{font-size:clamp(32px,7vw,62px);line-height:1.14;letter-spacing:-.035em}h2{font-size:clamp(24px,4vw,35px);line-height:1.25}h3{font-size:19px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--gold);margin-bottom:10px}.muted,small{color:var(--muted)}.primary{background:var(--gold);color:#20202a;border:none;border-radius:10px;padding:14px 20px;font-weight:900;width:100%;margin-top:14px}.secondary{border:1px solid #526582;background:transparent;border-radius:10px;padding:11px 14px;font-weight:700;width:100%;margin-top:9px}.hero{height:clamp(175px,30vw,290px);background:#253c54;position:relative;overflow:hidden}.hero svg{width:100%;height:100%;display:block}.status{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);background:#141f30}.stat label{display:flex;justify-content:space-between;gap:5px;font-size:12px;color:var(--muted)}.stat b{color:var(--ink);font-variant-numeric:tabular-nums}.track{height:7px;border-radius:20px;background:#34445b;margin-top:7px;overflow:hidden}.fill{height:100%;border-radius:20px;transition:width .4s}.steps{display:flex;gap:8px;margin:0 0 16px}.steps span{height:4px;flex:1;background:var(--line);border-radius:8px}.steps .active{background:var(--gold)}.dialog{background:#111c2d;border-left:3px solid var(--gold);padding:13px 16px;border-radius:0 9px 9px 0;margin:15px 0;color:#e2e7ed}.choice{width:100%;background:#24354a;border:1px solid #405572;border-radius:10px;padding:14px;text-align:left;display:flex;gap:12px;align-items:center;margin:9px 0;transition:background .15s}.choice:hover{background:#314660;border-color:var(--gold)}.letter{flex:0 0 32px;width:32px;height:32px;border-radius:7px;background:#101a2a;display:grid;place-items:center;color:var(--gold);font-weight:900}.selected{border-color:var(--gold);background:#374252}.result{padding:18px;border:1px solid #55647a;border-radius:12px;background:#142033;margin-top:18px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.chip{font-size:12px;font-weight:700;padding:4px 9px;border-radius:6px;background:#293a50;color:var(--ink)}.concept{background:#26364a;padding:16px;border-radius:10px;margin:10px 0}.concept strong{color:var(--gold)}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.notice{font-size:12px;color:var(--muted);margin-top:15px}.history{border-bottom:1px solid var(--line);padding:12px 0}.history:last-child{border-bottom:0}.history b{color:var(--gold)}.foot{text-align:center;color:var(--muted);font-size:12px;padding:14px}.guide{margin-top:12px}a{color:var(--blue);overflow-wrap:anywhere}details{border:1px solid var(--line);border-radius:9px;padding:12px;margin:12px 0}summary{cursor:pointer;font-weight:700;color:var(--gold)}.callout{font-size:clamp(21px,4vw,30px);font-weight:800;line-height:1.4;color:var(--gold)}.sceneLabel{position:absolute;left:16px;top:14px;background:#111a2bdc;border:1px solid #ffffff36;padding:4px 10px;border-radius:5px;letter-spacing:.1em;font-size:11px}.hidden{display:none}@media(max-width:520px){main{width:calc(100% - 20px);padding-top:12px}.tag{display:none}.status{padding:12px 10px;gap:9px}.stat label{font-size:10px}.split{grid-template-columns:1fr}.choice{padding:12px}.hero{height:185px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><header><div><div class="brand">CAREER QUEST / 01</div><div class="tag">性格心理學・互動展攤</div></div><div><button class="mini" id="reset">重玩</button></div></header><section id="app" class="panel" aria-live="polite"></section><div class="foot">虛構教學遊戲｜不蒐集個資｜非心理測驗或診斷</div></main><script>
const $=s=>document.querySelector(s);const app=$('#app');let page='home',index=0,history=[],stats=[50,50,0],picked=null;const names=['行動勇氣','焦慮張力','探索經驗'],colors=['#88d2ad','#f2a2a3','#82bdeb'];
const stages=[{day:100,title:'別人的人生進度',location:'01 / 深夜・社群動態',text:'畢業倒數100天。朋友在群組分享研究所錄取通知，另一位同學也拿到了工作 offer。你打開自己的生涯規劃，卻是一片空白。',thought:'大家是不是都跑得比我快？',options:[{t:'關掉社群，今晚先讓自己休息。',d:[0,-10,0],r:'你先離開比較的環境，讓心情緩和。不過，下一步仍需要自己慢慢規劃。',k:'暫時調節情緒並不等於逃避。若一直不再接觸生涯問題，才可能阻礙探索。'},{t:'私訊朋友，問問他是怎麼找到方向的。',d:[10,-5,20],r:'朋友告訴你，他也曾經不知道要做什麼，並分享了職涯資訊。',k:'把比較轉為學習與合作，呼應阿德勒的社會興趣與建設性補償。'},{t:'跟著朋友準備升學，至少看起來有方向。',d:[0,15,5],r:'你開始整理考試資料，卻發現自己對這個領域其實沒有太多興趣。',k:'若行動主要是為了證明自己不比別人差，可能偏向以他人標準補償不足。'}]},{day:60,title:'我真的夠格嗎？',location:'02 / 圖書館・求職頁面',text:'你發現一份感興趣的工作，招募條件有三項，你目前符合兩項，第三項是加分條件。申請截止日期快到了。',thought:'如果我不夠好，送出履歷不是自取其辱嗎？',options:[{t:'先準備第三項技能，下次有職缺再投。',d:[0,5,10],r:'你開始練習新技能，但這一次申請的機會結束了。',k:'補足技能可以是建設性補償；若一定要完美才肯開始，也可能成為保護自尊的方式。'},{t:'放棄申請，改找目前更有把握的工作。',d:[-5,-5,10],r:'你找到其他符合能力的職缺，但仍不確定自己是否喜歡。',k:'調整目標可能是務實選擇；若只是因為認定自己永遠不行，則可能反映自卑情結。'},{t:'確認資格、整理優勢，先投出一份履歷。',d:[15,10,25],r:'你順利送出申請，仍然緊張，但累積了第一次求職經驗。',k:'在感到不足時仍嘗試，體現面對不完美的勇氣。行動並不保證焦慮立即下降。'}]},{day:20,title:'第一次碰壁',location:'03 / 校園・收到消息',text:'',thought:'難道這就代表我真的不行？',options:[{t:'把這次碰壁當成證明，以後不再考慮這個方向。',d:[-20,15,0],r:'你暫時避開可能的挫折，但也減少了取得新資訊的機會。',k:'從一次事件推論整體能力不足，並持續放棄行動，可能呈現自卑情結的維持方式。'},{t:'先休息，再安排一次和老師討論的時間。',d:[10,-15,10],r:'你允許自己失望，也保留了重新探索的空間。',k:'鼓勵不等於強迫自己樂觀，休息與適當支持也可以幫助重新建立勇氣。'},{t:'請學長姐提供回饋，找出下一個可嘗試的方向。',d:[15,-5,25],r:'你獲得具體回饋，找到能調整的部分及新的選擇。',k:'合作、學習與貢獻可連結社會興趣；補償的方向是成長而非必須勝過他人。'}]}];
function scene(type){let sky=['#405c7a','#304660','#65849a','#353e60','#63877d'][type]||'#405c7a';let night=type===1||type===3;let content='';if(type===0||type===4){content=`<path d="M0 143 90 95 145 131 236 69 350 143 460 100 640 147V220H0Z" fill="#344b58"/><path d="M0 173 107 141 205 166 318 130 443 166 540 143 640 177V240H0Z" fill="#46655e"/><path d="M280 240 305 151 335 151 394 240Z" fill="#c2ad89"/><g fill="#263a4b"><rect x="75" y="84" width="116" height="64"/><rect x="95" y="68" width="76" height="16"/><rect x="449" y="99" width="107" height="54"/></g><g fill="#e3c489"><rect x="90" y="98" width="13" height="19"/><rect x="116" y="98" width="13" height="19"/><rect x="143" y="98" width="13" height="19"/><rect x="467" y="113" width="13" height="17"/><rect x="494" y="113" width="13" height="17"/></g><g transform="translate(309 138)"><rect x="0" y="0" width="22" height="21" fill="#e3ba91"/><rect x="-3" y="-6" width="28" height="10" fill="#273247"/><rect x="-5" y="21" width="32" height="32" fill="#dc9c69"/><rect x="-2" y="52" width="10" height="21" fill="#273247"/><rect x="14" y="52" width="10" height="21" fill="#273247"/><rect x="-6" y="23" width="9" height="24" fill="#5c7280"/></g>`;}else{content=`<rect x="0" y="0" width="640" height="240" fill="#27364a"/><rect x="42" y="18" width="200" height="127" fill="#131e30"/><rect x="50" y="26" width="184" height="111" fill="${sky}"/><path d="M50 110 90 74 140 110 195 62 234 105V137H50Z" fill="#314957"/><rect x="139" y="26" width="5" height="111" fill="#131e30"/><rect x="50" y="78" width="184" height="5" fill="#131e30"/><rect x="270" y="157" width="370" height="15" fill="#ac896e"/><rect x="285" y="172" width="12" height="68" fill="#6c594f"/><rect x="597" y="172" width="12" height="68" fill="#6c594f"/><rect x="385" y="86" width="132" height="70" rx="3" fill="#141d30"/><rect x="393" y="94" width="116" height="55" fill="#d5e6db"/><rect x="400" y="100" width="100" height="7" fill="#65908f"/><rect x="401" y="113" width="80" height="5" fill="#a4bab5"/><rect x="401" y="125" width="91" height="5" fill="#a4bab5"/><rect x="401" y="137" width="45" height="5" fill="#d59a6d"/><rect x="375" y="153" width="150" height="7" fill="#99a7b8"/><g transform="translate(310 100)"><rect x="0" y="0" width="32" height="29" fill="#e3ba91"/><rect x="-4" y="-9" width="38" height="13" fill="#182235"/><rect x="-4" y="1" width="8" height="20" fill="#182235"/><rect x="-8" y="29" width="46" height="57" fill="#bd895e"/><rect x="31" y="39" width="30" height="10" fill="#e3ba91"/><rect x="-10" y="86" width="60" height="13" fill="#415467"/></g><rect x="545" y="117" width="17" height="40" fill="#8197a2"/><rect x="566" y="125" width="21" height="32" fill="#bca17b"/>`;if(type===1)content+=`<g transform="translate(360 57)"><rect x="0" y="0" width="80" height="31" rx="4" fill="#e7d6ac"/><path d="M12 31 12 42 25 31" fill="#e7d6ac"/><rect x="10" y="9" width="60" height="5" fill="#a08062"/><rect x="10" y="19" width="42" height="4" fill="#a08062"/></g>`;if(type===3)content+=`<g transform="translate(420 108)"><rect width="56" height="32" fill="#eee3cc"/><path d="M0 0 28 19 56 0" fill="none" stroke="#9c726d" stroke-width="3"/></g>`;}
return `<div class="hero"><svg viewBox="0 0 640 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label="像素風校園冒險場景" shape-rendering="crispEdges"><rect width="640" height="240" fill="${sky}"/><rect x="468" y="28" width="38" height="38" fill="${night?'#d5ddeb':'#f1c582'}"/><g fill="#f0e7cc" opacity=".65"><rect x="58" y="29" width="3" height="3"/><rect x="218" y="41" width="3" height="3"/><rect x="566" y="58" width="3" height="3"/></g>${content}</svg><span class="sceneLabel">${type===0?'NEW GAME':type===4?'ENDING / 畢業日':stages[type-1].location}</span></div>`;}
function status(){return `<div class="status">${stats.map((v,i)=>`<div class="stat"><label>${names[i]} <b>${v}</b></label><div class="track"><div class="fill" style="width:${v}%;background:${colors[i]}"></div></div></div>`).join('')}</div>`}
function home(){page='home';app.innerHTML=scene(0)+`<div class="pad"><div class="eyebrow">互動式心理學故事・約 3–5 分鐘</div><h1>畢業倒數<br>100 天</h1><h3>當人生沒有攻略本</h3><p class="muted">你是一名即將畢業的大學生。三次選擇，三個人生片段。你不需要找到最正確的答案，只要決定故事中的主角會怎麼做。</p><div class="concept"><strong>主線任務</strong>｜在不確定中探索未來<br><small>從阿德勒的自卑情結探討大學生的生涯焦慮</small></div><button class="primary" id="start">▶ 開始冒險</button><button class="secondary" id="theory">先看心理學知識</button><p class="notice">數值為故事機制，非真實心理量表。不須填寫姓名，也不會上傳任何回答。</p></div>`;$('#start').onclick=()=>{page='game';render()};$('#theory').onclick=theory;}
function render(){page='game';const s=stages[index];let text=s.text;if(index===2){const prev=history[1];text=prev===2?'你收到上一關投出的履歷未錄取通知。這時朋友也告訴你，他已經找到工作了。':prev===0?'你練習新技能時遇到困難，一次作品被退回修改。朋友卻告訴你，他已經找到工作了。':'你申請了另一份較有把握的工作，卻沒有獲得面試通知。朋友此時也已經找到工作了。';}app.innerHTML=scene(index+1)+status()+`<div class="pad"><div class="steps">${stages.map((_,i)=>`<span class="${i<=index?'active':''}"></span>`).join('')}</div><div class="eyebrow">第 ${index+1} 關 / 3　・　倒數 ${s.day} 天</div><h2>${s.title}</h2><p>${text}</p><div class="dialog">💬 主角內心：${s.thought}</div><h3>如果是故事中的你，會怎麼選？</h3><div id="options">${s.options.map((o,i)=>`<button class="choice" data-i="${i}"><span class="letter">${'ABC'[i]}</span><span>${o.t}</span></button>`).join('')}</div><div id="feedback"></div></div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(+b.dataset.i));}
function choose(i){if(picked!==null)return;picked=i;const o=stages[index].options[i];stats=stats.map((n,j)=>Math.min(100,Math.max(0,n+o.d[j])));document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===i)b.classList.add('selected')});document.querySelector('.status').outerHTML=status();$('#feedback').innerHTML=`<div class="result"><div class="eyebrow">事件結果</div><p>${o.r}</p><div class="chips">${o.d.map((n,j)=>`<span class="chip">${names[j]} ${n>0?'+':''}${n}</span>`).join('')}</div><button class="primary" id="next">${index===2?'解鎖故事結局':'前往下一關 →'}</button></div>`;$('#next').onclick=()=>{history.push(picked);picked=null;index++;index===3?ending():render();scrollTop()};$('#feedback').scrollIntoView({block:'nearest',behavior:'smooth'});}
function ending(){page='end';let title,desc;if(stats[2]>=45){title='未知的冒險者';desc='主角累積了探索經驗，仍可能感到不安，但擁有更多資訊與下一步的選擇。';}else if(stats[0]>=40){title='十字路口的旅人';desc='主角還在準備與探索之間尋找平衡，下一步可以從小型嘗試開始。';}else{title='暫時停下的旅人';desc='主角目前需要更多支持與喘息空間，也可以重新尋找適合自己的探索方式。';}app.innerHTML=scene(4)+status()+`<div class="pad"><div class="eyebrow">ENDING UNLOCKED / 故事結局</div><h2>${title}</h2><p>${desc}</p><p class="callout">人生沒有永久的結局。</p><p class="muted">這是虛構角色的故事走向，不是玩家的人格分類或心理狀態判定。</p><button class="primary" id="learn">解鎖心理學解析 →</button><button class="secondary" id="again">換一條路線重玩</button></div>`;$('#learn').onclick=theory;$('#again').onclick=restart;}
function theory(){page='theory';app.innerHTML=`<div class="pad"><div class="eyebrow">QUEST COMPLETE / 理論解密</div><h2>阿德勒看見了什麼？</h2><p>阿德勒認為，感受到不足本身是正常的，重要的是個體如何理解不足，以及朝什麼目標行動。</p><div class="split"><div class="concept"><strong>自卑感</strong><p>「我還有不足。」</p><small>可能促使人學習、尋求協助與成長。</small></div><div class="concept"><strong>自卑情結</strong><p>「我不夠好，所以我永遠做不到。」</p><small>持續且強烈的不足感可能阻礙面對生活任務。不能憑一次選擇判定。</small></div></div><div class="concept"><strong>補償與追求優越</strong><p>面對不足，可以學習新技能、調整目標，而非一定要比別人強。</p><strong>社會興趣與鼓勵</strong><p>與他人合作、關心共同福祉，並在不完美中建立面對困難的勇氣。</p></div>${history.length===3?`<h3>你的故事回放</h3>${history.map((v,i)=>`<div class="history"><b>第 ${i+1} 關・${stages[i].title}</b><p>${stages[i].options[v].t}</p><small>${stages[i].options[v].k}</small></div>`).join('')}`:''}<div class="concept"><strong>攤位討論題</strong><p>當一個人害怕自己能力不足時，怎麼區分務實的準備和因害怕失敗而一直不敢嘗試？</p></div><p class="notice">生涯焦慮也受到家庭期待、經濟壓力、就業市場與資訊取得影響。本遊戲為理論情境示範，並非已驗證的因果模型。</p><details><summary>參考文獻與來源</summary><p>Adler, A. (1927). <i>Understanding human nature.</i></p><p>Adler, A. (1938). <i>Social interest: A challenge to mankind.</i> <a href="https://adler.school/archivo/adler/original/1938%20Social%20Interest.%20A%20Challenge%20to%20Mankind" target="_blank" rel="noopener">原典</a></p><p>Gati, I., Krausz, M., &amp; Osipow, S. H. (1996). A taxonomy of difficulties in career decision making. <i>Journal of Counseling Psychology, 43</i>(4), 510–526. <a href="https://doi.org/10.1037/0022-0167.43.4.510" target="_blank" rel="noopener">DOI</a></p><p>田秀蘭（2001）。大專學生對生涯決定困難的知覺分析。教育心理學報，33(1)，87–98。<a href="https://doi.org/10.6251/BEP.20010612" target="_blank" rel="noopener">DOI</a></p><p><a href="https://www.ncbi.nlm.nih.gov/books/NBK599518/" target="_blank" rel="noopener">Adlerian Therapy — NCBI Bookshelf</a></p></details><button class="primary" id="restart">回到首頁・下一組玩家</button></div>`;$('#restart').onclick=restart;scrollTop()}
function scrollTop(){window.scrollTo({top:0,behavior:'auto'})}function restart(){index=0;history=[];stats=[50,50,0];picked=null;home();scrollTop()}$('#reset').onclick=()=>{if(page==='home'||page==='end'||page==='theory'||confirm('確定回到首頁？目前故事進度將清除。'))restart()};home();
</script></body></html>
